spring.application.name=salon-backend

# Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/salon_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:your_db_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Configuration
app.jwt.secret=${APP_JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-ms=86400000

# Razorpay Configuration (Test Mode keys - replace with your actual test keys)
razorpay.key.id=${RAZORPAY_KEY_ID:rzp_test_placeholderKey}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:placeholderSecret}

# Server (Supports dynamic cloud port assignment like Render / Railway)
server.port=${PORT:8080}

# Spring AI OpenAI Configuration (Connected to NVIDIA NIM)
spring.ai.openai.base-url=${AI_BASE_URL:https://integrate.api.nvidia.com}
spring.ai.openai.api-key=${AI_API_KEY:your_nvidia_api_key_here}
spring.ai.openai.chat.options.model=${AI_MODEL:nvidia/nemotron-3.5-lightning-30b-a3b}
spring.ai.openai.chat.options.temperature=0.7
ai.conversation.max-history=20
